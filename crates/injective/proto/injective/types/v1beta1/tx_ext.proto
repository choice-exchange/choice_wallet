// Written for Choice Wallet (Apache-2.0) from Injective's public wire format.
// Not copied from injective-core, which is BUSL-1.1. Only the package, message
// names and field numbers match, because the chain's type URLs and encoding
// require them. Verified against injective-ts test vectors.
syntax = "proto3";

package injective.types.v1beta1;

// TxBody extension option for transactions signed as EIP-712 typed data.
// Type URL: /injective.types.v1beta1.ExtensionOptionsWeb3Tx
message ExtensionOptionsWeb3Tx {
  // The chain ID in the EIP-712 domain (the EVM chain ID, e.g. 1776).
  uint64 typedDataChainID = 1;
  // Fee payer account, when the fee is delegated.
  string feePayer = 2;
  // The fee payer's signature, when the fee is delegated.
  bytes feePayerSig = 3;
}
