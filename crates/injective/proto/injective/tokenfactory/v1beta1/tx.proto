// Written for Choice Wallet (Apache-2.0) from Injective's public wire format.
// Not copied from injective-core, which is BUSL-1.1. Only the package, message
// names and field numbers match, because the chain's type URLs and encoding
// require them. Verified against injective-ts test vectors.
syntax = "proto3";

package injective.tokenfactory.v1beta1;

// Hand a tokenfactory denom's admin rights to `new_admin`. The admin can mint,
// burn and change metadata, so the wallet treats this as high risk.
// Type URL: /injective.tokenfactory.v1beta1.MsgChangeAdmin
message MsgChangeAdmin {
  string sender = 1;
  string denom = 2;
  string new_admin = 3;
}
