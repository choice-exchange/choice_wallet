# Builds a release from a signed tag v<version>: the deterministic zip, SHA256SUMS and a Sigstore
# provenance attestation, attached to a DRAFT GitHub release. A maintainer publishes the draft and
# uploads to the Chrome Web Store by hand. See docs/SECURITY.md, Releases, for what must be set
# up outside this file (the protected `release` environment, the tag ruleset, verified uploads).
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # the draft release
      id-token: write # Sigstore
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag is annotated and signed by a key GitHub verifies
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          if [ "$(jq -r .object.type <<<"$ref")" != tag ]; then
            echo "::error::$TAG is a lightweight tag; release tags are annotated and signed"; exit 1
          fi
          verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")" --jq .verification.verified)
          if [ "$verified" != true ]; then
            echo "::error::$TAG is not signed by a key GitHub verifies"; exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - name: Toolchains
        run: |
          rustup toolchain install # the version in rust-toolchain.toml
          cargo install wasm-bindgen-cli --version 0.2.130 --locked

      - name: Dependencies
        run: npm ci --ignore-scripts

      - name: Build the release
        run: node extension/release.mjs

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: extension/release/*.zip

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --draft --title "$TAG" \
            --notes "Built from $TAG by the release workflow. Check a store package with: node extension/crx-compare.mjs <store.crx> <zip> SHA256SUMS" \
            extension/release/*
