# Builds a release from a signed tag v<version>: the deterministic zip, SHA256SUMS and a Sigstore
# provenance attestation, attached to a DRAFT GitHub release. A maintainer publishes the draft and
# uploads to the Chrome Web Store by hand. See docs/SECURITY.md, Releases, for what must be set
# up outside this file (the protected `release` environment, the tag ruleset, verified uploads).
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # the draft release
      id-token: write # Sigstore
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag is annotated, signed by a key GitHub verifies, and names the commit built
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A Chrome version only, so the name read below is this tag and nothing else (run-5).
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){0,3}$ ]]; then echo "::error::$TAG is not v<Chrome version>"; exit 1; fi
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          if [ "$(jq -r .object.type <<<"$ref")" != tag ]; then
            echo "::error::$TAG is a lightweight tag; release tags are annotated and signed"; exit 1
          fi
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")")
          if [ "$(jq -r .verification.verified <<<"$tag")" != true ]; then
            echo "::error::$TAG is not signed by a key GitHub verifies"; exit 1
          fi
          # The signed tag read here must name the commit this job checked out and builds: a tag
          # moved after the push started the job would otherwise vouch for another commit (run-4).
          if [ "$(jq -r '.object.type + " " + .object.sha' <<<"$tag")" != "commit $GITHUB_SHA" ] || [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG's signed tag doesn't name the commit this job builds"; exit 1
          fi
          # Only from reviewed history. The tagged commit's own copy of this file runs, so the
          # watchdog checks this again from the default branch's copy (run-5).
          main=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$main" --jq .status)
          if [ "$status" != ahead ] && [ "$status" != identical ]; then
            echo "::error::$TAG's commit is not on $main"; exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - name: Toolchains
        run: |
          rustup toolchain install # the version in rust-toolchain.toml
          cargo install wasm-bindgen-cli --version 0.2.130 --locked

      - name: Dependencies
        run: npm ci --ignore-scripts

      - name: Build the release
        run: node extension/release.mjs

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: extension/release/*.zip

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --draft --title "$TAG" \
            --notes "Built from $TAG by the release workflow. Check a store package with: node extension/crx-compare.mjs <store.crx> <zip> SHA256SUMS" \
            extension/release/*
