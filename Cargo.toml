[workspace]
resolver = "3"
members = ["crates/core", "crates/cosmos", "crates/evm", "crates/injective", "crates/policy", "crates/vault", "crates/wasm"]
# Dev tools have their own lockfiles, so their dependencies never enter the wallet's.
exclude = ["tools/protogen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/choice-exchange/choice_wallet"

[workspace.dependencies]
choice-wallet-core = { path = "crates/core" }
choice-wallet-cosmos = { path = "crates/cosmos" }
choice-wallet-evm = { path = "crates/evm" }
choice-wallet-injective = { path = "crates/injective" }
choice-wallet-policy = { path = "crates/policy" }
choice-wallet-vault = { path = "crates/vault" }

# Vault dependency budget: see docs/SECURITY.md before adding anything here.
# Versions surveyed on crates.io 2026-11-08: each is the newest stable release.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
bech32 = { version = "0.12.0", default-features = false, features = ["alloc"] }
bip32 = { version = "0.6.0", default-features = false, features = ["alloc", "secp256k1"] }
bip39 = { version = "3.0.0", default-features = false, features = ["std", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
getrandom = "0.4.3"
k256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
prost = { version = "0.14.4", default-features = false, features = ["std", "derive"] }
# JSON inside transactions: CosmWasm messages, amino JSON, EIP-712.
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std", "raw_value"] }
sha2 = { version = "0.11.1", default-features = false }
sha3 = { version = "0.12.0", default-features = false }
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["derive", "serde"] }
# Only in the WASM crate. Already in the lockfile through getrandom's `wasm_js` backend.
wasm-bindgen = { version = "=0.2.130", default-features = false, features = ["std"] }

# Test-only.
hex = "0.4.3"

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
